services:
  postgres:
    image: postgres:16
    container_name: text-to-sql-postgres
    environment:
      POSTGRES_DB: text_to_sql
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5432:5432"
    volumes:
      - text-to-sql-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d text_to_sql"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - text-to-sql-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text-to-sql-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:dev_password_123@postgres:5432/text_to_sql
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - text-to-sql-network

volumes:
  text-to-sql-postgres-data:
    name: text-to-sql-postgres-data

networks:
  text-to-sql-network:
    driver: bridge