[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql-clarification-engine"
version = "0.1.0"
description = "Production-oriented Text-to-SQL system with a Clarification Engineer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.35.0",
    "google-genai>=2.18.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]